name: release

# Fires ONLY on a version tag you push, e.g.:  git tag v0.1.0 && git push --tags
# Builds a multi-arch image, pushes it to GHCR, and signs it (keyless cosign).
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write        # push to ghcr.io
  id-token: write        # keyless cosign (OIDC) + provenance attestation

env:
  IMAGE: ghcr.io/chicohaager/dropbridge

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # QEMU only needed if a stage can't cross-compile; kept for safety.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags/labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}      # v0.1.0 -> 0.1.0  (immutable)
            type=semver,pattern={{major}}.{{minor}} # -> 0.1
            type=raw,value=latest                 # moving tag

      - name: Build & push (multi-arch)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true                        # SLSA build provenance
          sbom: true                              # software bill of materials

      # Supply-chain: keyless signature tied to this repo's OIDC identity.
      - uses: sigstore/cosign-installer@v3
      - name: Sign image
        run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
